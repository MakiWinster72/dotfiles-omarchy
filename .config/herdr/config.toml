onboarding = false
[ui]
# 新建 Tab 和 Space 时直接创建，不先询问名称；需要时再手动重命名
prompt_new_tab_name = false
prompt_new_workspace_name = false

# 在面板边框上显示 Agent 名称
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"
[keys]
# Prefix 键：先按 Alt+Q，再按后续功能键
prefix = "alt+q"

# 重新加载配置：Alt+Q → Shift+I
reload_config = "prefix+shift+i"

# 重命名当前面板：Alt+Q → Shift+P
rename_pane = "prefix+shift+p"

# 水平分割：Alt+Q → -（新面板出现在下方）
split_horizontal = "prefix+minus"

# 垂直分割：Alt+Q → \（新面板出现在右侧）
split_vertical = "prefix+backslash"

# 使用 Ctrl+方向键直接向相应方向调整面板大小
resize_pane_left = "ctrl+left"
resize_pane_down = "ctrl+down"
resize_pane_up = "ctrl+up"
resize_pane_right = "ctrl+right"

# 使用 Ctrl+A/D 直接切换上一个/下一个 Tab
previous_tab = "ctrl+a"
next_tab = "ctrl+d"

# 使用 Alt+A/D 切换上一个/下一个 Space
previous_workspace = "alt+a"
next_workspace = "alt+d"

# 以下为未自定义的 Herdr 快捷键参考；注释后继续使用程序默认值

# 打开快捷键帮助
# help = "prefix+?"
# 打开设置
# settings = "prefix+s"
# 与当前 Session 分离，但保留后台任务
# detach = "prefix+q"
# 打开当前通知所指向的目标
# open_notification_target = "prefix+o"
# 打开 Space（Workspace）选择器
# workspace_picker = "prefix+w"
# 打开 Session 导航器
# goto = "prefix+g"

# 新建 Space（Workspace）：Alt+Q → Shift+C
new_workspace = "prefix+shift+c"
# 新建 Git Worktree
# new_worktree = "prefix+shift+g"
# 打开已有 Git Worktree（默认未绑定）
# open_worktree = ""
# 删除所选 Worktree（默认未绑定，会要求确认）
# remove_worktree = ""
# 重命名所选 Space（Workspace）
# rename_workspace = "prefix+shift+w"
# 关闭所选 Space（Workspace）
# close_workspace = "prefix+shift+d"
# 切换到上一个/下一个 Space 的默认键位（默认未绑定，已在上方自定义）
# previous_workspace 默认值：""
# next_workspace 默认值：""
# 切换到上一个/下一个 Agent（默认未绑定）
# previous_agent = ""
# next_agent = ""
# 按序号聚焦 Agent（默认未绑定，例如 prefix+alt+1..9）
# focus_agent = ""
# 远程连接时粘贴本地剪贴板图片
# remote_image_paste = "ctrl+v"

# 新建 Tab：Alt+Q → C
new_tab = "prefix+c"
# 重命名当前 Tab
# rename_tab = "prefix+shift+t"
# 切换到上一个/下一个 Tab 的默认键位（已在上方改为 Ctrl+A/D）
# previous_tab 默认值："prefix+p"
# next_tab 默认值："prefix+n"
# 向前/向后移动当前 Tab（默认未绑定）
# move_tab_previous = ""
# move_tab_next = ""
# 使用数字 1～9 切换 Tab
# switch_tab = "prefix+1..9"
# 使用数字 1～9 切换 Space（默认未绑定）
# switch_workspace = ""
# 关闭当前 Tab
# close_tab = "prefix+shift+x"

# 在编辑器中打开当前面板的回滚内容
# edit_scrollback = "prefix+e"
# 循环切换到下一个/上一个面板
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# 返回上一次聚焦的面板（默认未绑定）
# last_pane = ""
# 关闭当前面板
# close_pane = "prefix+x"
# 缩放或还原当前面板
# zoom = "prefix+z"
# 进入面板大小调整模式
# resize_mode = "prefix+r"
# 显示或隐藏侧边栏
# toggle_sidebar = "prefix+b"

# 导航模式中的按键；仅在导航模式开启时生效
# navigate_workspace_up = "up"
# navigate_workspace_down = "down"
# navigate_pane_left = "h"
# navigate_pane_down = "j"
# navigate_pane_up = "k"
# navigate_pane_right = "l"

# 自定义命令示例（取消注释后可用）
# [[keys.command]]
# key = "prefix+alt+g"
# type = "popup"
# command = "lazygit"
# description = "打开 lazygit"
# width = "80%"
# height = "80%"

# 注意：TOML 的数组表必须放在所有普通 [keys] 配置之后。
# Ctrl+H/J/K/L 在 Neovim split 与 Herdr pane 间无缝导航
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

# Alt+H/J/K/L 在 Neovim split 与 Herdr pane 间无缝调整大小
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

[theme]
name = "rose-pine"
auto_switch = false

[ui.toast]
delivery = "system"
